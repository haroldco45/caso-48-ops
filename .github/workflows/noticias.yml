name: Robot de noticias (cada 30 min)

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: robot-noticias
  cancel-in-progress: false

jobs:
  traer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Traer noticias reales del caso
        run: node scripts/traer-noticias.mjs

      - name: Guardar si hay cambios
        run: |
          git config user.name "robot-vibras"
          git config user.email "actions@users.noreply.github.com"
          git add data/noticias.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Noticias $(TZ=America/Bogota date '+%Y-%m-%d %H:%M') COL"
            git push
          fi
